# connect.memixai.com → 本机 8400（IdentAI 牵线）
# 证书: certbot certonly --webroot -w /www/wwwroot/acme -d connect.memixai.com（webroot 方式，续期走 root 的 crontab）
server {
    listen 80;
    server_name connect.memixai.com;
    location /.well-known/acme-challenge/ { root /www/wwwroot/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name connect.memixai.com;

    ssl_certificate     /etc/letsencrypt/live/connect.memixai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connect.memixai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # MCP 的流式响应不能被缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
